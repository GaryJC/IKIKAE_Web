<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcfcfc"/>
      <stop offset="1" stop-color="#f6f6f6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1440" height="900" fill="url(#bg)"/>
  <circle cx="720" cy="90" r="340" fill="#000" opacity="0.08" filter="url(#soft)"/>

  <!-- Header -->
  <rect x="0" y="0" width="1440" height="76" fill="#fcfcfc"/>
  <rect x="0" y="75" width="1440" height="1" fill="rgba(0,0,0,0.12)"/>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#0a0a0a">
    <text x="120" y="46" font-size="12" letter-spacing="4" font-weight="700">IKIKAE</text>
    <text x="630" y="46" font-size="13" fill="#525252">Home</text>
    <text x="690" y="46" font-size="13" fill="#525252">About</text>
    <text x="754" y="46" font-size="13" fill="#525252">Contact Us</text>
  </g>
  <g>
    <rect x="1220" y="24" rx="18" ry="18" width="100" height="36" fill="#0a0a0a"/>
    <text x="1250" y="48" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#fcfcfc" font-weight="600">Sign In</text>
  </g>

  <!-- Main container guide -->
  <rect x="96" y="112" width="1248" height="748" fill="none" stroke="rgba(0,0,0,0.06)"/>

  <!-- Hero -->
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="120" y="160" font-size="11" letter-spacing="3" font-weight="700" fill="#525252">生き変え / IKIKAE</text>
    <text x="120" y="232" font-size="58" font-weight="700" letter-spacing="-1" fill="#0a0a0a">Wear the sentence</text>
    <text x="120" y="292" font-size="58" font-weight="700" letter-spacing="-1" fill="#0a0a0a">you refuse to forget.</text>
    <text x="120" y="336" font-size="16" fill="#525252">Dream. Change. Achieve. Claim an ID and connect it to your QR.</text>
  </g>

  <g>
    <rect x="120" y="368" rx="22" ry="22" width="178" height="44" fill="#0a0a0a"/>
    <text x="146" y="396" font-size="14" font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#fcfcfc" font-weight="600">Create Your Motto</text>

    <rect x="312" y="368" rx="22" ry="22" width="122" height="44" fill="#fcfcfc" stroke="rgba(0,0,0,0.12)"/>
    <text x="344" y="396" font-size="14" font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#0a0a0a" font-weight="600">Why Ikikae</text>
  </g>

  <!-- Motto sample card -->
  <g>
    <rect x="948" y="162" rx="26" ry="26" width="372" height="270" fill="#f2f2f2" stroke="rgba(0,0,0,0.12)"/>
    <text x="980" y="202" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#525252" font-weight="700" letter-spacing="3">MOTTO SAMPLE</text>
    <rect x="980" y="220" rx="18" ry="18" width="308" height="150" fill="#fcfcfc" stroke="rgba(0,0,0,0.12)"/>
    <text x="1006" y="268" font-size="15" font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#0a0a0a" font-style="italic">“Move with intent. Keep your eyes</text>
    <text x="1006" y="292" font-size="15" font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#0a0a0a" font-style="italic">on the work.”</text>
    <text x="1006" y="336" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#525252">ID: IKIKAE-019</text>
    <text x="980" y="404" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#525252">Shareable link + QR-connected profile.</text>
  </g>

  <!-- Feature cards row -->
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="120" y="470" width="1200" height="1" fill="rgba(0,0,0,0.12)"/>

    <g>
      <rect x="120" y="512" rx="18" ry="18" width="392" height="152" fill="#fcfcfc" stroke="rgba(0,0,0,0.12)"/>
      <text x="146" y="544" font-size="11" fill="#525252" font-weight="700" letter-spacing="3">01</text>
      <text x="146" y="576" font-size="18" fill="#0a0a0a" font-weight="700">Claim a unique ID</text>
      <text x="146" y="604" font-size="13" fill="#525252">One person, one motto. A public anchor</text>
      <text x="146" y="622" font-size="13" fill="#525252">that stays consistent.</text>
    </g>

    <g>
      <rect x="524" y="512" rx="18" ry="18" width="392" height="152" fill="#fcfcfc" stroke="rgba(0,0,0,0.12)"/>
      <text x="550" y="544" font-size="11" fill="#525252" font-weight="700" letter-spacing="3">02</text>
      <text x="550" y="576" font-size="18" fill="#0a0a0a" font-weight="700">Control visibility</text>
      <text x="550" y="604" font-size="13" fill="#525252">Public or private with a share link</text>
      <text x="550" y="622" font-size="13" fill="#525252">when you choose to publish.</text>
    </g>

    <g>
      <rect x="928" y="512" rx="18" ry="18" width="392" height="152" fill="#fcfcfc" stroke="rgba(0,0,0,0.12)"/>
      <text x="954" y="544" font-size="11" fill="#525252" font-weight="700" letter-spacing="3">03</text>
      <text x="954" y="576" font-size="18" fill="#0a0a0a" font-weight="700">Connect it to QR</text>
      <text x="954" y="604" font-size="13" fill="#525252">Link a QR code to your profile so</text>
      <text x="954" y="622" font-size="13" fill="#525252">your motto shows up instantly.</text>
    </g>
  </g>

  <!-- Black CTA -->
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="120" y="706" rx="26" ry="26" width="1200" height="150" fill="#0a0a0a"/>
    <text x="160" y="748" font-size="11" fill="rgba(252,252,252,0.75)" font-weight="700" letter-spacing="3">THE POINT</text>
    <text x="160" y="790" font-size="28" fill="#fcfcfc" font-weight="700">Your clothes are a reminder system.</text>
    <text x="160" y="820" font-size="14" fill="rgba(252,252,252,0.78)">Small enough to repeat, sharp enough to steer decisions.</text>
    <rect x="160" y="834" rx="22" ry="22" width="110" height="44" fill="#fcfcfc"/>
    <text x="190" y="862" font-size="14" fill="#0a0a0a" font-weight="700">Contact</text>
  </g>
</svg>

