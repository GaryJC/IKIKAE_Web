<main>
<h1>先把光落在褶皱上</h1>
<p>参考图里，眼窝和半边脸都很暗，几片亮面却足以交代雕塑的朝向。现在的衣服已经有织纹，最值得调整的是肩胸之间那一大片灰亮面的形状。</p>
<div class="grid">
<figure><div class="crop"><img src="gallery-header.jpg" alt="第一幕当前实拍，光环、侧脸和肩线的局部"></div>
<figcaption><h2>01 · 给脸留一处亮面</h2><p>光环勾出了头部轮廓，发卷也有亮点，但眉弓和颧骨之间的转折在暗部里不容易读。把现有的侧后反光板略向前转，让靠光一侧的眉弓或颧骨接到一小片光，保留另一侧脸和眼窝的深暗。</p></figcaption></figure>
<figure><div class="crop chest"><img src="frontal-desktop-2.jpg" alt="第二幕当前实拍，肩部、胸标和拉链的局部"></div>
<figcaption><h2>02 · 把胸口的反光收窄</h2><p>左胸有一大片连续的灰色反光，肩缝、布面和拉链的亮部连在一起。先缩窄并旋转现有的反光板，让一条有软边的斜光擦过肩缝，在褶谷里断开，胸标周围保留一块安静的暗面。</p></figcaption></figure>
</div><footer><p><strong>建议先看 02 的同机位对照。</strong>第一轮只换灯位，保留曝光、材质和镜头。观察推近时那条光有没有贴着褶皱移动。若布面仍然像整片涂层，再收一点正面反射，把柔亮留给布料的斜侧面，把短而清楚的亮点留给拉链。</p></footer>
