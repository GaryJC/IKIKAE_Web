<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>侧肩镜头 · 光影对照</title><style>*{box-sizing:border-box}body{margin:5vw auto;padding:0 5vw;max-width:1440px;background:#151614;color:#eee;font:17px/1.6 system-ui}h1{font-size:clamp(28px,4vw,55px)}main{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}img{width:100%;height:auto;display:block}b{color:#e4c7a0}figcaption{margin-top:.5em}p{max-width:55em}@media(max-width:760px){main{grid-template-columns:1fr}}</style><h1>光应该落在哪里？</h1><main><figure><img src="reference-side-light.jpg" alt="录屏里侧转的暗色雕像，肩峰一道亮边"><figcaption>参考 · 录屏 6.97 秒。注意眼窝、颈侧和肩峰之间的亮度差。</figcaption></figure><figure><img src="story-shoulder-desktop.jpg" alt="当前白色雕像与亮面连帽衫"><figcaption>当前 · 第二镜。整张脸偏白，前胸有一大片均匀反光。</figcaption></figure></main><p><b>先调灯：</b>固定第二镜，保留深色环境，只在侧上方留一块宽亮面，后方加一条窄亮面。暂时隐藏光环，调到肩线清楚、衣褶暗处仍有层次。</p><p><b>再调材质：</b>头部试深色抛光石；衣服保留非金属的丝光，复用已有粗糙度贴图区分衣片。最后沿原运镜查看高光是否连续滑过衣领和肩部。</p></html>
